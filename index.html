<!-- Rating Section -->
<section id="ratings">
  <h2>Rate Café Queen</h2>

  <!-- User1 -->
  <div class="user-rating" data-user="user1">
    <h3>User1</h3>
    <div class="stars" id="stars-user1">
      <span data-value="1">&#9734;</span>
      <span data-value="2">&#9734;</span>
      <span data-value="3">&#9734;</span>
      <span data-value="4">&#9734;</span>
      <span data-value="5">&#9734;</span>
    </div>
    <p>Your rating: <span id="rating-value-user1">0</span> stars</p>
  </div>

  <!-- User2 -->
  <div class="user-rating" data-user="user2">
    <h3>User2</h3>
    <div class="stars" id="stars-user2">
      <span data-value="1">&#9734;</span>
      <span data-value="2">&#9734;</span>
      <span data-value="3">&#9734;</span>
      <span data-value="4">&#9734;</span>
      <span data-value="5">&#9734;</span>
    </div>
    <p>Your rating: <span id="rating-value-user2">0</span> stars</p>
  </div>
</section>

<script>
const userRatings = {
  user1: 0,
  user2: 0
};

function setupRating(user) {
  const stars = document.querySelectorAll(`#stars-${user} span`);
  stars.forEach(star => {
    star.addEventListener('click', () => {
      const value = parseInt(star.getAttribute('data-value'));
      userRatings[user] = value;
      document.getElementById(`rating-value-${user}`).textContent = value;
      updateStars(user);
    });
  });
}

function updateStars(user) {
  const stars = document.querySelectorAll(`#stars-${user} span`);
  const value = userRatings[user];
  stars.forEach(star => {
    if(parseInt(star.getAttribute('data-value')) <= value){
      star.style.color = '#ff5a5f'; // colored for selected
    } else {
      star.style.color = 'grey'; // outline for unselected
    }
  });
}

setupRating('user1');
setupRating('user2');
</script>

<style>
.stars span {
  font-size: 2em;
  cursor: pointer;
  color: grey;
  transition: 0.2s;
}
.stars span:hover,
.stars span:hover ~ span {
  color: #ff8a8f;
}
</style>
